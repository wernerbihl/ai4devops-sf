# Assign variables.sf.tagId to an existing factory tag before importing.
id: focused-bug-fix
namespace: sf.recipes
description: Focused bug fix
variables:
  sf:
    schemaVersion: 1
    recipeId: focused-bug-fix
    displayName: Focused bug fix
    tagId: Bug Fixes
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          default: the explicitly requested area
        context:
          type: string
          default: ""
      additionalProperties: false
    taskTemplate:
      title: "{{ title }}"
      description: "{{ description }}"
      goal: Reproduce and fix the reported bug within {{ inputs.scope }}. {{
        description }}
      acceptanceCriteria:
        - A regression check demonstrates the fix
        - Existing behavior outside the bug remains intact
      skills: []
      tools: []
      context: "{{ inputs.context }}"
    required:
      paths:
        - root: .
          mode: write
      tools: []
      networkDestinations: []
      credentialRefs: []
      allowedFinishPolicies:
        - pr
    compatibleOwners:
      - vscode
    compatibleProviders:
      - copilot
      - codex
    defaultProviderId: copilot
    defaultFinishPolicy: pr
    skillVersions: {}
    toolVersions: {}
inputs:
  - id: sf_capability
    type: SECRET
    required: true
  - id: sf_native_start
    type: JSON
    required: true
tasks:
  - id: native_start
    type: io.kestra.plugin.core.http.Request
    uri: http://sf-broker:8080/worker/v1/native/start
    method: POST
    contentType: application/json
    headers:
      Authorization: Bearer {{ inputs.sf_capability }}
    body: "{{ inputs.sf_native_start | toJson }}"
    options:
      followRedirects: false
      allowFailed: false
      allowedResponseCodes:
        - 200
  - id: await_result
    type: io.kestra.plugin.core.flow.Pause
    onResume:
      - id: sf_result
        type: JSON
        required: true
      - id: sf_result_capability
        type: SECRET
        required: true
  - id: submit_result
    type: io.kestra.plugin.core.http.Request
    uri: http://sf-broker:8080/worker/v1/results
    method: POST
    contentType: application/json
    headers:
      Authorization: Bearer {{ outputs.await_result.onResume.sf_result_capability }}
    body: "{{ outputs.await_result.onResume.sf_result | toJson }}"
    options:
      followRedirects: false
      allowFailed: false
      allowedResponseCodes:
        - 200
