name: Verify portable Runner
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.2', cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm run protocol:check
      - run: npm run package
      - run: SF_RELEASE_TARBALL="$PWD/artifacts/ai4devops-sf-0.1.0.tgz" npm test
      - run: npm run release:check
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.22.2', '26.13.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run package
      - run: npm run verify:package -- artifacts/ai4devops-sf-0.1.0.tgz "${{ runner.temp }}/sf cold 工場"
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.os }}-${{ matrix.node }}
          path: artifacts/*.tgz
